services:
  simulator:
    build:
      context: .
      dockerfile: simulator/Dockerfile
    ports:
      - "3868:3868"
    networks:
      - telecom-net
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 3868 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - DIAMETER_HOST=simulator
      - DIAMETER_PORT=3868
    depends_on:
      - simulator
    networks:
      - telecom-net

networks:
  telecom-net:
